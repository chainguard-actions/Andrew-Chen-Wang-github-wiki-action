name: Test disable-empty-commits feature
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Create wiki content directory
        run: |
          mkdir -p wiki
          echo "# Hello Wiki" > wiki/README.md

      - name: Set up fake wiki git repo and mock gh command
        run: |
          FAKE_ROOT="$GITHUB_WORKSPACE/fakewiki-root"
          FAKE_WIKI="$FAKE_ROOT/testorg/testrepo.wiki.git"
          mkdir -p "$FAKE_ROOT/testorg"

          git init --bare "$FAKE_WIKI"

          SEED_DIR=$(mktemp -d)
          cd "$SEED_DIR"
          git init -b master
          git config user.email "test@example.com"
          git config user.name "Test User"
          echo "# Home" > Home.md
          git add .
          git commit -m "Initial wiki"
          git remote add origin "$FAKE_WIKI"
          git push origin master
          cd "$GITHUB_WORKSPACE"

          mkdir -p "$GITHUB_WORKSPACE/.fake-bin"
          printf '%s\n' '#!/bin/sh' \
            'if [ "$1" = "auth" ] && [ "$2" = "setup-git" ]; then' \
            '  echo "Fake gh: auth setup-git (no-op)"' \
            '  exit 0' \
            'fi' \
            'exec /usr/bin/gh "$@"' \
            > "$GITHUB_WORKSPACE/.fake-bin/gh"
          chmod +x "$GITHUB_WORKSPACE/.fake-bin/gh"

      - id: action
        uses: .
        env:
          PATH: ${{ github.workspace }}/.fake-bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        with:
          strategy: clone
          repository: testorg/testrepo
          github-server-url: file://${{ github.workspace }}/fakewiki-root
          path: wiki
          dry-run: true
          preprocess: false
          disable-empty-commits: true
          commit-message: "Test commit from disable-empty-commits test"

      - name: Assert wiki_url output is set
        env:
          WIKI_URL: ${{ steps.action.outputs.wiki_url }}
        run: |
          echo "wiki_url: $WIKI_URL"
          if [ -z "$WIKI_URL" ]; then
            echo "FAIL: wiki_url output is empty"
            exit 1
          fi
          echo "PASS: wiki_url is set to $WIKI_URL"

      - name: Assert wiki_url contains expected repo name
        env:
          WIKI_URL: ${{ steps.action.outputs.wiki_url }}
        run: |
          echo "wiki_url: $WIKI_URL"
          if echo "$WIKI_URL" | grep -q "testrepo"; then
            echo "PASS: wiki_url contains expected repo name"
          else
            echo "FAIL: wiki_url does not contain expected repo name"
            exit 1
          fi
