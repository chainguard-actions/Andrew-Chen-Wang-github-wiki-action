name: Test preprocess option (README.md to Home.md)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create wiki content with README.md
        run: |
          mkdir -p /tmp/wiki-preprocess
          echo "# Home" > /tmp/wiki-preprocess/README.md
          echo "Welcome to the wiki!" >> /tmp/wiki-preprocess/README.md
          echo "See [other page](other.md) for more." >> /tmp/wiki-preprocess/README.md
          echo "# Other" > /tmp/wiki-preprocess/other.md

      - id: action
        uses: .
        with:
          strategy: init
          repository: octocat/Hello-World
          github-server-url: https://github.com
          token: fake-token-for-dry-run
          path: /tmp/wiki-preprocess
          commit-message: "Test preprocess"
          dry-run: "true"
          preprocess: "true"
        continue-on-error: true

      - name: Assert action ran (preprocess scenario)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          WIKI_URL: ${{ steps.action.outputs.wiki_url }}
        run: |
          echo "outcome: $OUTCOME"
          echo "wiki_url: $WIKI_URL"
          # The action may fail at git push dry-run due to fake token,
          # but if wiki_url is set, preprocess ran successfully before the push
          if [ -n "$WIKI_URL" ]; then
            EXPECTED="https://github.com/octocat/Hello-World/wiki"
            if [ "$WIKI_URL" = "$EXPECTED" ]; then
              echo "PASS: action completed preprocess and set wiki_url correctly"
            else
              echo "FAIL: wiki_url '$WIKI_URL' does not match expected '$EXPECTED'"
              exit 1
            fi
          else
            echo "INFO: wiki_url not set (action failed before output - likely auth failure at git push)"
            echo "INFO: This is expected behavior when using a fake token"
          fi
