name: Test preprocess option
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create wiki content with README and .md links
        run: |
          mkdir -p wiki
          echo "# Home" > wiki/README.md
          echo "See [About](About.md) for more info." >> wiki/README.md
          echo "# About" > wiki/About.md
          echo "This is the about page." >> wiki/About.md

      - name: Set up mock git and gh to intercept wiki operations
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.mock-bin"

          # Mock gh: no-op for auth setup-git
          printf '%s\n' '#!/bin/sh' \
            'if [ "$1" = "auth" ] && [ "$2" = "setup-git" ]; then' \
            '  exit 0' \
            'fi' \
            'exec /usr/bin/gh "$@"' \
            > "$GITHUB_WORKSPACE/.mock-bin/gh"
          chmod +x "$GITHUB_WORKSPACE/.mock-bin/gh"

          # Mock git: intercept wiki.git clone and push --dry-run
          printf '%s\n' '#!/bin/sh' \
            'for arg in "$@"; do' \
            '  case "$arg" in' \
            '    *.wiki.git)' \
            '      /usr/bin/git init -b master .' \
            '      /usr/bin/git -c user.email="test@example.com" -c user.name="Test" commit --allow-empty -m "Initial wiki commit"' \
            '      exit 0' \
            '      ;;' \
            '  esac' \
            'done' \
            'case "$*" in' \
            '  *push*--dry-run*)' \
            '    echo "Everything up-to-date (dry-run)"' \
            '    exit 0' \
            '    ;;' \
            'esac' \
            'exec /usr/bin/git "$@"' \
            > "$GITHUB_WORKSPACE/.mock-bin/git"
          chmod +x "$GITHUB_WORKSPACE/.mock-bin/git"

          echo "$GITHUB_WORKSPACE/.mock-bin" >> "$GITHUB_PATH"

      - id: action
        uses: .
        with:
          strategy: clone
          path: wiki
          dry-run: "true"
          preprocess: "true"
          commit-message: "Test preprocess"

      - name: Assert wiki_url output is set after preprocess
        env:
          ACTUAL: ${{ steps.action.outputs.wiki_url }}
        run: |
          echo "actual wiki_url: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: wiki_url output is empty"
            exit 1
          fi
          if ! echo "$ACTUAL" | grep -q '/wiki$'; then
            echo "FAIL: wiki_url does not end with /wiki"
            exit 1
          fi
          echo "PASS: preprocess scenario completed successfully"
