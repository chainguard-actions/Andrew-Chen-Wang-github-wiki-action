name: Update tags
on:
  release:
    types: [released]
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  update-tags:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/publish-action@dca2315f75060c81e52b00dfc86b660107013642 # v0.2.2
        with:
          source-tag: ${{ github.event.release.tag_name }}
